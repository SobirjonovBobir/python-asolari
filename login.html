<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kirish — Python Asoslari</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("python-asolari-theme") || "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(900px 480px at 10% -10%, rgba(16, 185, 129, 0.18) 0%, transparent 55%),
        radial-gradient(800px 420px at 100% 0%, rgba(52, 211, 153, 0.1) 0%, transparent 50%),
        var(--bg);
    }
    .auth-card {
      width: min(420px, 100%);
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 26px;
      box-shadow: var(--shadow);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .auth-card h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .auth-card .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
    }
    .auth-card label {
      display: block;
      font-size: 13px;
      margin: 0 0 6px;
      color: var(--accent-2);
      font-weight: 600;
    }
    .auth-card input[type="text"],
    .auth-card input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      margin-bottom: 14px;
      background: var(--input-bg);
      color: var(--ink);
    }
    .auth-card input:focus {
      outline: 2px solid rgba(16, 185, 129, 0.45);
      outline-offset: 1px;
      border-color: var(--accent);
    }
    .pw-wrap {
      position: relative;
      margin-bottom: 14px;
    }
    .pw-wrap input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 44px 11px 12px;
      font: inherit;
      margin-bottom: 0;
      background: var(--input-bg);
      color: var(--ink);
    }
    .pw-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }
    .pw-toggle:hover { background: var(--accent-soft); color: var(--accent-2); }
    .auth-card button[type="submit"] {
      width: 100%;
      margin-top: 6px;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font: inherit;
      font-weight: 650;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }
    .auth-err {
      display: none;
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: var(--bad);
      font-size: 13px;
    }
    .auth-err.show { display: block; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="login-form">
      <div class="auth-brand">
        <div class="brand-logo" aria-hidden="true">Py</div>
        <h1>Python Asoslari</h1>
      </div>
      <div class="theme-toggle" style="margin:0 0 16px">
        <span class="theme-toggle-label">Tungi rejim<small>Qorong‘i fon</small></span>
        <label class="theme-switch">
          <input type="checkbox" id="theme-toggle" aria-label="Tungi rejim" />
          <span class="theme-slider"></span>
        </label>
      </div>
      <p class="sub">Hisob faqat admin tomonidan ochiladi. Login va parolingizni kiriting.</p>
      <div class="auth-err" id="err"></div>
      <label for="username">Login</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">Parol</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Parolni ko‘rsatish" aria-pressed="false" title="Ko‘rsatish / yashirish">👁</button>
      </div>
      <button type="submit">Kirish</button>
    </form>
  </div>
  <script src="js/api.js"></script>
  <script>
    (function initTheme() {
      const KEY = "python-asolari-theme";
      const mode = localStorage.getItem(KEY) || "light";
      document.body.classList.add(mode === "dark" ? "theme-dark" : "theme-light");
      const toggle = document.getElementById("theme-toggle");
      if (toggle) {
        toggle.checked = mode === "dark";
        toggle.onchange = () => {
          const dark = toggle.checked;
          document.body.classList.remove("theme-light", "theme-dark");
          document.body.classList.add(dark ? "theme-dark" : "theme-light");
          localStorage.setItem(KEY, dark ? "dark" : "light");
        };
      }
    })();
    if (API.token()) {
      const u = API.user();
      location.href = u && u.role === "admin" ? "/admin" : "/";
    }
    const err = document.getElementById("err");
    const pw = document.getElementById("password");
    const toggle = document.getElementById("pw-toggle");
    toggle.onclick = () => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      toggle.setAttribute("aria-pressed", show ? "true" : "false");
      toggle.setAttribute("aria-label", show ? "Parolni yashirish" : "Parolni ko‘rsatish");
      toggle.textContent = show ? "🙈" : "👁";
    };
    document.getElementById("login-form").onsubmit = async (e) => {
      e.preventDefault();
      err.classList.remove("show");
      try {
        const data = await API.login(
          document.getElementById("username").value.trim(),
          pw.value
        );
        API.setSession(data);
        location.href = data.role === "admin" ? "/admin" : "/";
      } catch (ex) {
        err.textContent = ex.message || "Kirish amalga oshmadi";
        err.classList.add("show");
      }
    };
  </script>
</body>
</html>
